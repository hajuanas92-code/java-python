spring.application.name=demo

# Enable the web-based H2 database dashboard
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Set up the temporary in-memory database name
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Force Servlet type initialization to bypass the webmvc-test 404 issue
spring.main.web-application-type=servlet

# Prints exact SQL queries to your terminal console
spring.jpa.show-sql=true

